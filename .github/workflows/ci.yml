name: cpu-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          lines = [line for line in Path("requirements.txt").read_text().splitlines()
                   if line.strip() and not line.startswith("torch==")]
          Path("/tmp/srtp-requirements.txt").write_text("\n".join(lines) + "\n")
          PY
          python -m pip install -r /tmp/srtp-requirements.txt
      - name: Compile and import smoke
        run: |
          python -m compileall -q src scripts tests
          python -c "import src.models, src.pruning, src.artifacts, src.agent_runner, src.agent_benchmarks"
      - name: CPU unit and tiny-model suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m unittest discover -s tests -v
