method: sparsegpt
display_name: SparseGPT
default_sparsity: 0.3
structure: unstructured
scope: per_linear_adaptive_input_column_blocks
criterion: obs_reconstruction_error
calibration_required: true
calibration_source: c4
calibration_samples: 128
calibration_sequence_length: 2048
calibration_seed: 0
percdamp: 0.01
blocksize: 128
adaptive_mask_selection: true
error_compensation: true
weight_update: true
retraining: false
quantization: false
nm_sparsity: false
true_sequential: false
sequential_layerwise: true
target_policy: linear_weights_inside_transformer_blocks
excluded_components:
  - token_embeddings
  - final_norm
  - all_norm_parameters
  - lm_head
  - bias
  - parameters_outside_blocks
implementation_version: "1.0"
implementation_status: implemented
